# =============================================
# Lynx AI 配置文件模板
# 使用说明：
# 1. 复制此文件为 application.properties
# 2. 修改所有标记为【必填】的配置项
# 3. 根据实际情况调整【可选】配置项
# =============================================

# =============================================
# 服务器配置
# =============================================
# 应用服务端口
server.port=8080

# =============================================
# HTTP编码配置【重要】
# 说明：解决中文乱码问题，确保所有HTTP响应使用UTF-8编码
# =============================================
# 强制HTTP响应编码为UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

# =============================================
# MySQL 数据库配置【必填】
# =============================================
# 数据库连接地址（注意：数据库名是 lynx-ai）
# 格式：jdbc:mysql://主机:端口/数据库名?参数
spring.datasource.url=jdbc:mysql://localhost:3306/zyg-test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
# 数据库用户名
spring.datasource.username=root
# 数据库密码
spring.datasource.password=123456
# 数据库驱动类（无需修改）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# MyBatis-Plus 配置
# =============================================
# 是否开启驼峰命名自动映射（无需修改）
mybatis-plus.configuration.map-underscore-to-camel-case=true

# =============================================
# Redis 配置【必填】
# =============================================
# Redis服务器地址
spring.data.redis.host=localhost
# Redis服务器端口
spring.data.redis.port=6379
# Redis数据库索引（0-15）
spring.data.redis.database=0
# Redis密码（如果没有密码则留空）
spring.data.redis.password=
# 连接超时时间（毫秒）
spring.data.redis.timeout=60000

# =============================================
# Elasticsearch 配置【必填】
# =============================================
# Elasticsearch服务器地址
elasticsearch.host=localhost
# Elasticsearch服务器端口
elasticsearch.port=9200
# Elasticsearch用户名
elasticsearch.username=elastic
# Elasticsearch密码
elasticsearch.password=your_password
# 向量索引名称（用于存储文档向量）
elasticsearch.index.vector=ai-vectors

# =============================================
# 文件上传配置【可选】
# =============================================
# 单个文件最大大小
spring.servlet.multipart.max-file-size=50MB
# 整个请求最大大小
spring.servlet.multipart.max-request-size=50MB

# =============================================
# MinIO 对象存储配置【可选】
# 说明：如果不使用MinIO，可以注释掉此部分
# =============================================
# MinIO服务地址
minio.endpoint=http://localhost:9001
# MinIO访问密钥
minio.access-key=admin123
# MinIO密钥
minio.secret-key=admin123
# 知识库文件存储桶名称
minio.bucket.knowledge=knowledge-files
# 图片存储桶名称
minio.bucket.images=knowledge-images

# =============================================
# AI模型配置【必填】
# 说明：至少配置一个模型的API Key
# =============================================
# 阿里百炼（通义千问）API Key
dashscope.api-key=sk-7d92f0ef756140539981b9b3c33e1a4e

# OpenAI API Key（可选）
# openai.api-key=your_openai_api_key

# =============================================
# RAG（检索增强生成）系统级配置【可选】
# =============================================
# 最小召回数量保底值
# 说明：无论相似度如何，至少召回多少条结果
# 推荐值：10-20，默认15
rag.min-recall-count=15

# 是否记录详细日志
# 说明：开启后会记录RAG检索的详细过程
# 推荐值：开发环境true，生产环境false
rag.verbose-logging=true

# 对话历史最大消息数
# 说明：保留在上下文中的最大对话轮数
# 推荐值：10-30，默认20
chat.max-messages=20

# =============================================
# RAG 混合检索配置【可选】
# 说明：以下配置已移至智能体级别，此处仅作为兜底默认值
# =============================================
# 是否启用混合检索（向量检索 + BM25关键词检索）
# 推荐值：true（建议开启）
rag.enable-hybrid-search=true

# 是否启用查询扩展
# 说明：使用LLM对用户查询进行扩展，生成同义词
# 推荐值：true（建议开启）
rag.enable-query-expansion=true

# BM25检索权重（0-1之间）
# 说明：关键词检索的权重占比
# 推荐值：0.2-0.4，默认0.3
rag.bm25-weight=0.3

# 向量检索权重（0-1之间）
# 说明：语义检索的权重占比
# 注意：bm25-weight + vector-weight = 1.0
# 推荐值：0.6-0.8，默认0.7
rag.vector-weight=0.7

# =============================================
# RAG 功能增强配置【可选】
# =============================================
# 是否启用查询改写
# 说明：使用LLM优化用户的原始查询
# 推荐值：true
rag.enable-query-rewriting=true

# 是否启用Self-RAG验证
# 说明：使用LLM对检索结果进行二次验证
# 推荐值：true
rag.enable-self-rag=true

# Self-RAG最低相关性阈值（0-1之间）
# 推荐值：0.4-0.6，默认0.5
rag.self-rag-min-relevance=0.5

# Self-RAG最大LLM验证数量
# 说明：最多验证多少条结果，超过使用关键词评估
# 推荐值：3-10，默认5
rag.self-rag-max-verify-count=5

# 是否启用对话摘要
# 说明：对话过长时自动生成摘要
# 推荐值：true
rag.enable-conversation-summary=true

# 对话摘要触发阈值
# 说明：消息数超过此值时触发摘要
# 推荐值：15-30，默认20
rag.summary-threshold=20

# 摘要后保留的最近消息数
# 推荐值：5-15，默认10
rag.summary-keep-recent=10

# 是否启用意图识别
# 说明：识别用户查询意图，用于安全防护
# 推荐值：true（必须开启）
rag.enable-intent-recognition=true

# =============================================
# 日志配置【可选】
# =============================================
# 根日志级别（TRACE/DEBUG/INFO/WARN/ERROR）
logging.level.root=info
# LibreOffice文档转换日志
logging.level.com.laomao.agent.util.DocumentToPdfConverter=DEBUG
# 知识库服务日志
logging.level.com.laomao.agent.service.impl.KnowledgeBaseServiceImpl=DEBUG

# =============================================
# Sa-Token 权限认证配置【可选】
# =============================================
# Token名称
sa-token.token-name=Authorization
# Token有效期（秒），7天
sa-token.timeout=604800
# Token最低活跃频率（秒），2小时
sa-token.active-timeout=7200
# 是否允许同一账号多地登录
sa-token.is-concurrent=true
# 多人登录是否共用token
sa-token.is-share=true
# Token风格
sa-token.token-style=uuid
# 是否输出操作日志
sa-token.is-log=false
# 是否从Header读取token
sa-token.is-read-header=true
# 是否从Cookie读取token
sa-token.is-read-cookie=false

# =============================================
# LibreOffice 本地转换配置【推荐】
# 说明：推荐安装，用于将Word/Excel/PPT转换为PDF，实现精准的原文定位功能
# =============================================
# LibreOffice安装路径
# Windows示例：D:/Program Files/LibreOffice
# Linux示例：/usr/lib/libreoffice
# Mac示例：/Applications/LibreOffice.app/Contents
libreoffice.home=D:/Program Files/LibreOffice
# 转换超时时间（秒）
libreoffice.timeout=120
# 最大并发转换任务数
libreoffice.max-tasks=5
