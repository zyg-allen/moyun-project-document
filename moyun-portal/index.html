<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>旭林知行 - AI 驱动的求职面试与学习成长平台</title>
    <meta name="title" content="旭林知行 - AI 驱动的求职面试与学习成长平台" />
    <meta name="description" content="旭林知行 - AI 驱动的求职面试与学习成长平台，为求职者提供面试技巧、题库刷题、简历优化与成长路径，助你知行合一、成功上岸。" />
    <meta name="keywords" content="面试,求职,刷题,算法,简历,面经,题库,学习,成长,AI面试" />
    <meta name="author" content="旭林知行" />
    <meta name="robots" content="index, follow" />
    <!-- canonical / og:url：站点域名由构建期注入（%SITE_URL% ← VITE_SITE_URL，见 vite.config.ts 的 moyun:site-url 插件） -->
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="旭林知行" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="旭林知行 - AI 驱动的求职面试与学习成长平台" />
    <meta property="og:description" content="旭林知行 - 为求职者提供面试技巧、题库刷题、简历优化与成长路径的一站式平台。" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="%SITE_URL%/" />
    <meta property="twitter:title" content="旭林知行 - AI 驱动的求职面试与学习成长平台" />
    <meta property="twitter:description" content="旭林知行 - 为求职者提供面试技巧、题库刷题、简历优化与成长路径的一站式平台。" />
    <meta property="twitter:image" content="%OG_IMAGE%" />

    <!-- 结构化数据 JSON-LD：帮助搜索引擎理解站点实体 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "旭林知行",
      "alternateName": "Xulin Zhixing",
      "url": "%SITE_URL%/",
      "description": "为求职者提供面试技巧、题库刷题、简历优化与成长路径的一站式平台",
      "inLanguage": "zh-CN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "%SITE_URL%/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
