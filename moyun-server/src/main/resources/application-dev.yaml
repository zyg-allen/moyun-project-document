spring:
  # =============================================
  # MySQL 数据源配置
  # 凭据通过环境变量注入，未设置时回退到本地默认值（仅用于开发环境）
  # =============================================
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/moyun-db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    druid:
      # 连接池基础配置
      initial-size: 5
      min-idle: 10
      max-active: 20
      max-wait: 60000
      connect-timeout: 30000
      socket-timeout: 60000
      # 连接检测
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      # 监控统计
      filters: stat,wall,slf4j
      filter:
        stat:
          merge-sql: true
          slow-sql-millis: 5000
          log-slow-sql: true
        wall:
          config:
            multi-statement-allow: true
      # Druid Web 监控页
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        # 监控页凭据同样通过环境变量注入，默认值仅用于开发环境
        login-username: ${DRUID_USERNAME:admin}
        login-password: ${DRUID_PASSWORD:admin}
        allow: ""
        deny: ""
      # Spring 监控
      aop-patterns: com.moyun.system.service.*

  # =============================================
  # Redis 配置
  # 密码通过环境变量注入；本地无密码时留空
  # =============================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}         # 本地无密码，留空；生产环境设为真实密码
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

    # MongoDB 配置（可选，辅助中间件）
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/moyun}
      auto-index-creation: true

# =============================================
# 日志配置（本地环境覆盖）
# =============================================
logging:
  level:
    # SQL 日志（仅本地开启）
    org.hibernate.SQL: debug

# =============================================
# Token 配置（本地环境覆盖）
# =============================================
token:
  expireTime: 30              # 本地 30 分钟，生产建议 120
  # 开发环境专用密钥默认值（至少64字符/512位，HS512算法要求），生产环境必须通过 TOKEN_SECRET 环境变量覆盖
  # 如需自定义：设置环境变量 TOKEN_SECRET 即可覆盖此默认值
  secret: ${TOKEN_SECRET:moyun-dev-only-secret-key-do-not-use-in-prod-env-at-least-64-chars-2026}

# =============================================
# 墨韵框架配置（本地文件路径覆盖）
# =============================================
moyun:
  profile: /profile            # 本地文件存储路径

# =============================================
# MyBatis-Plus 配置
# =============================================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.moyun.core.base.entity,com.moyun.system.domain.entity,com.moyun.portal.domain.entity,com.moyun.ext.cms.domain.entity,com.moyun.ext.job.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      # 逻辑删除：与 sys_user / sys_dept / sys_role / portal_user 已有的 del_flag 字段对齐
      # 字段类型 char(1)，"0"=存在 "2"=删除（RuoYi 框架惯例）
      logic-delete-field: delFlag
      logic-delete-value: "2"
      logic-not-delete-value: "0"

# =============================================
# Flowable 工作流配置
# =============================================
flowable:
  async-executor-activate: false
  check-process-definitions: false
  # ⚠️ 注意：本地开发时设置为 true 让 Flowable 自动建表
  #        已有建表脚本则设为 false 避免重复创建
  database-schema-update: true
  history-level: audit
  database-type: mysql
  eventregistry:
    enabled: false
  cmmn:
    enabled: false
  dmn:
    enabled: false
  app:
    enabled: false

# =============================================
# MinIO 文件存储配置
# 凭据通过环境变量注入，默认值仅用于开发环境
# =============================================
minio:
  enabled: true              # false=本地文件系统，true=MinIO 对象存储
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9001}
  access-key: ${MINIO_ACCESS_KEY:admin123}
  secret-key: ${MINIO_SECRET_KEY:admin123}
  bucket-name: ${MINIO_BUCKET_NAME:moyun}
  # v1.1.2 修复：access-url 应是 MinIO 服务根地址，不含 bucket 名。
  # 旧默认值 http://127.0.0.1:9001/moyun 已包含 bucket 名 moyun，
  # 而 MinioUtils.getFileUrl() 会再拼一次 bucketName，导致 URL 出现两个 moyun
  access-url: ${MINIO_ACCESS_URL:http://127.0.0.1:9001}
  # 降级配置（运行期可调，无需重启；可通过 /system/file/storage/switch 接口切换）
  auto-fallback: true        # 自动降级：MinIO 上传/连接异常时自动切到本地存储（默认 true）
  fallback-to-local: false   # 手动强制降级到本地存储（true=强制走本地，忽略 MinIO 配置）
